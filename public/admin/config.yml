backend:
  name: github
  repo: bada1951a/astro-paper
  branch: main

local_backend: true

media_folder: "public/assets/images"
public_folder: "/assets/images"

collections:
  - name: "blog"
    label: "블로그 포스트"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "작성일", name: "pubDatetime", widget: "datetime" }
      - { label: "설명", name: "description", widget: "string" }
      - { label: "본문", name: "body", widget: "markdown" }
